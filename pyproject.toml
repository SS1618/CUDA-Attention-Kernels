# ==============================================================================
# 1. THE PEP 517/518 BUILD ISOLATION CONTROLLER
# ==============================================================================
[build-system]
# Tells frontend tools (like pip) what dependencies it needs to use for building.
# When compiling unisolated, pip verifies these exist in your host environment.
requires = [
    "setuptools>=61.0.0",
    "wheel>=0.36.0",
    "torch>=2.0.0",
    "numpy",
]
build-backend = "setuptools.build_meta"

# ==============================================================================
# 2. CORE PROJECT METADATA DEFINITIONS (PEP 621)
# ==============================================================================
[project]
name = "sdpa_lib"
version = "0.1.0"
description = "A highly modular, pluggable attention benchmark harness"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Saurav" }
]
license = { text = "MIT" }

# Runtime package dependencies installed when someone imports this project
dependencies = [
    "torch>=2.0.0",
    "triton>=2.0.0",
    "pyyaml",
]

# ==============================================================================
# 3. SETUOTOOLS SPECIFIC PACKAGE DISCOVERY HINTS
# ==============================================================================
[tool.setuptools]
# Instructs setuptools to look inside the 'src' directory for python source folders
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ==============================================================================
# 4. ENVIRONMENT STATIC ANALYSIS & TOOL CONFIGURATIONS
# ==============================================================================
[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
known_first_party = ["sdpa_lib"]
